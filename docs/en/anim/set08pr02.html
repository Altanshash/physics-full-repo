<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Problem 2 Animation</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f1ff, #f8fbff);
    color: #1b263b;
  }

  .container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 22px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
  }

  h1 {
    text-align: center;
    color: #0b3d91;
    margin-bottom: 5px;
  }

  .subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
  }

  .stage {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 25px;
    align-items: center;
  }

  .card {
    background: #f8fbff;
    border: 1px solid #d8e6ff;
    border-radius: 18px;
    padding: 20px;
    min-height: 250px;
  }

  .step-title {
    font-size: 24px;
    font-weight: bold;
    color: #0b3d91;
    margin-bottom: 15px;
  }

  .text {
    font-size: 19px;
    line-height: 1.6;
  }

  .formula {
    margin-top: 18px;
    padding: 14px;
    background: white;
    border-radius: 14px;
    border: 1px solid #cfdfff;
    font-size: 26px;
    text-align: center;
    color: #003566;
  }

  .result {
    margin-top: 18px;
    padding: 14px;
    background: #e8f8ef;
    border: 1px solid #95d5b2;
    border-radius: 14px;
    font-size: 24px;
    font-weight: bold;
    color: #007f5f;
    text-align: center;
  }

  .controls {
    text-align: center;
    margin-top: 25px;
  }

  button {
    padding: 12px 22px;
    margin: 6px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  #startBtn { background: #2a9d8f; }
  #stopBtn { background: #e63946; }
  #resetBtn { background: #457b9d; }
  #nextBtn { background: #7209b7; }

  svg {
    width: 100%;
    height: auto;
    background: #ffffff;
    border-radius: 18px;
    border: 1px solid #d8e6ff;
  }

  .wire {
    stroke: #1d3557;
    stroke-width: 5;
    fill: none;
    stroke-linecap: round;
  }

  .electron {
    opacity: 0;
  }

  .electron.run {
    opacity: 1;
    animation: flow 2s linear infinite;
  }

  @keyframes flow {
    0% { transform: translateX(0); }
    100% { transform: translateX(240px); }
  }

  .fade {
    opacity: 0;
    transform: translateY(15px);
    transition: all 0.6s ease;
  }

  .fade.show {
    opacity: 1;
    transform: translateY(0);
  }

  .bar {
    transform-origin: bottom;
    transform: scaleY(0);
    transition: transform 0.8s ease;
  }

  .bar.show {
    transform: scaleY(1);
  }

  .pulse {
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .footer-box {
    margin-top: 22px;
    background: #fff7e6;
    border: 1px solid #ffd166;
    border-radius: 15px;
    padding: 15px;
    font-size: 19px;
    text-align: center;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Problem 2 – Uncertainty Propagation</h1>
  <div class="subtitle">Resistance from Ohm's Law using the Total Differential Method</div>

  <div class="stage">
    <div class="card">
      <div class="step-title" id="stepTitle">Ready</div>
      <div class="text" id="stepText">Click Start to begin the animation.</div>
      <div class="formula" id="formulaBox">R = U / I</div>
      <div class="result" id="resultBox">Waiting...</div>
    </div>

    <svg viewBox="0 0 620 420">
      <!-- Circuit -->
      <path class="wire" d="M120 210 H240" />
      <path class="wire" d="M380 210 H500" />
      <path class="wire" d="M500 210 V330 H120 V210" />

      <!-- Battery -->
      <line x1="115" y1="170" x2="115" y2="250" stroke="#1d3557" stroke-width="5"/>
      <line x1="145" y1="185" x2="145" y2="235" stroke="#1d3557" stroke-width="5"/>
      <text x="75" y="160" font-size="22" fill="#0b3d91">U = 5.23 ± 0.04 V</text>

      <!-- Resistor -->
      <rect x="240" y="175" width="140" height="70" rx="12" fill="#edf6f9" stroke="#0b3d91" stroke-width="4"/>
      <text x="310" y="218" text-anchor="middle" font-size="26" fill="#0b3d91">R</text>

      <!-- Ammeter -->
      <circle cx="500" cy="210" r="38" fill="#fff" stroke="#0b3d91" stroke-width="4"/>
      <text x="500" y="218" text-anchor="middle" font-size="28" fill="#0b3d91">A</text>
      <text x="435" y="150" font-size="22" fill="#0b3d91">I = 0.482 ± 0.006 A</text>

      <!-- Moving electrons -->
      <circle class="electron" id="e1" cx="130" cy="210" r="7" fill="#2a9d8f"/>
      <circle class="electron" id="e2" cx="175" cy="210" r="7" fill="#2a9d8f"/>
      <circle class="electron" id="e3" cx="220" cy="210" r="7" fill="#2a9d8f"/>

      <!-- Formula labels -->
      <text id="labelR" class="fade" x="310" y="310" text-anchor="middle" font-size="26" fill="#007f5f">
        R = 10.85 Ω
      </text>

      <!-- Bar chart -->
      <g transform="translate(60,350)">
        <text id="chartTitle" class="fade" x="250" y="-165" text-anchor="middle" font-size="22" fill="#1b263b">
          Relative Uncertainty Comparison
        </text>

        <line x1="0" y1="0" x2="500" y2="0" stroke="#333" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="-150" stroke="#333" stroke-width="2"/>

        <rect id="barU" class="bar" x="90" y="-75" width="90" height="75" fill="#457b9d"/>
        <rect id="barI" class="bar" x="300" y="-122" width="90" height="122" fill="#e76f51"/>

        <text id="barULabel" class="fade" x="135" y="-85" text-anchor="middle" font-size="18">
          0.00765
        </text>
        <text id="barILabel" class="fade" x="345" y="-132" text-anchor="middle" font-size="18">
          0.01245
        </text>

        <text id="uText" class="fade" x="135" y="25" text-anchor="middle" font-size="18">
          u(U) / U
        </text>
        <text id="iText" class="fade" x="345" y="25" text-anchor="middle" font-size="18">
          u(I) / I
        </text>
      </g>
    </svg>
  </div>

  <div class="footer-box" id="footerBox">
    Final result will appear here.
  </div>

  <div class="controls">
    <button id="startBtn" onclick="startAnimation()">Start</button>
    <button id="stopBtn" onclick="stopAnimation()">Stop</button>
    <button id="resetBtn" onclick="resetAnimation()">Reset</button>
    <button id="nextBtn" onclick="nextStep()">Next Step</button>
  </div>
</div>

<script>
  let timers = [];
  let currentStep = 0;

  const steps = [
    {
      title: "Step 1: Given Data",
      text: "Voltage and current are measured with uncertainties.",
      formula: "U = 5.23 ± 0.04 V<br>I = 0.482 ± 0.006 A",
      result: "We need to find resistance R.",
      action: function() {
        document.querySelectorAll(".electron").forEach(e => e.classList.add("run"));
      }
    },
    {
      title: "Step 2: Ohm's Law",
      text: "Resistance is calculated using Ohm's law.",
      formula: "R = U / I",
      result: "R = 5.23 / 0.482",
      action: function() {
        document.getElementById("labelR").classList.add("show");
      }
    },
    {
      title: "Step 3: Resistance Value",
      text: "Now calculate the resistance value.",
      formula: "R = 5.23 / 0.482",
      result: "R = 10.85 Ω",
      action: function() {
        document.getElementById("labelR").classList.add("show");
        document.getElementById("labelR").classList.add("pulse");
      }
    },
    {
      title: "Step 4: Total Differential Method",
      text: "For R = U / I, the relative uncertainty is the sum of the relative uncertainties of voltage and current.",
      formula: "u(R) / R = u(U) / U + u(I) / I",
      result: "This formula is used for maximum uncertainty.",
      action: function() {}
    },
    {
      title: "Step 5: Voltage Relative Uncertainty",
      text: "Calculate the relative uncertainty caused by voltage.",
      formula: "u(U) / U = 0.04 / 5.23",
      result: "u(U) / U = 0.00765",
      action: function() {
        showChartBase();
        document.getElementById("barU").classList.add("show");
        document.getElementById("barULabel").classList.add("show");
        document.getElementById("uText").classList.add("show");
      }
    },
    {
      title: "Step 6: Current Relative Uncertainty",
      text: "Calculate the relative uncertainty caused by current.",
      formula: "u(I) / I = 0.006 / 0.482",
      result: "u(I) / I = 0.01245",
      action: function() {
        showChartBase();
        document.getElementById("barU").classList.add("show");
        document.getElementById("barI").classList.add("show");
        document.getElementById("barULabel").classList.add("show");
        document.getElementById("barILabel").classList.add("show");
        document.getElementById("uText").classList.add("show");
        document.getElementById("iText").classList.add("show");
      }
    },
    {
      title: "Step 7: Total Relative Uncertainty",
      text: "Add both relative uncertainties.",
      formula: "u(R) / R = 0.00765 + 0.01245",
      result: "u(R) / R = 0.02010 = 2.01%",
      action: function() {
        showChartBase();
        document.getElementById("barU").classList.add("show");
        document.getElementById("barI").classList.add("show");
        document.getElementById("barULabel").classList.add("show");
        document.getElementById("barILabel").classList.add("show");
        document.getElementById("uText").classList.add("show");
        document.getElementById("iText").classList.add("show");
      }
    },
    {
      title: "Step 8: Absolute Uncertainty",
      text: "Multiply resistance by relative uncertainty.",
      formula: "u(R) = R · u(R) / R",
      result: "u(R) = 10.85 · 0.02010 = 0.22 Ω",
      action: function() {}
    },
    {
      title: "Conclusion",
      text: "The current measurement dominates the uncertainty because its relative uncertainty is larger.",
      formula: "0.01245 > 0.00765",
      result: "R = 10.85 ± 0.22 Ω",
      action: function() {
        document.getElementById("footerBox").innerHTML =
          "Conclusion: The resistance is <b>R = 10.85 ± 0.22 Ω</b>. The current measurement dominates the uncertainty.";
      }
    }
  ];

  function showChartBase() {
    document.getElementById("chartTitle").classList.add("show");
  }

  function updateStep(index) {
    const step = steps[index];

    document.getElementById("stepTitle").innerHTML = step.title;
    document.getElementById("stepText").innerHTML = step.text;
    document.getElementById("formulaBox").innerHTML = step.formula;
    document.getElementById("resultBox").innerHTML = step.result;

    step.action();
  }

  function startAnimation() {
    resetAnimation();
    currentStep = 0;

    steps.forEach((step, index) => {
      let timer = setTimeout(() => {
        currentStep = index;
        updateStep(index);
      }, index * 2500);

      timers.push(timer);
    });
  }

  function stopAnimation() {
    timers.forEach(timer => clearTimeout(timer));
    timers = [];
    document.getElementById("stepText").innerHTML = "Animation stopped.";
  }

  function nextStep() {
    if (currentStep < steps.length) {
      updateStep(currentStep);
      currentStep++;
    }
  }

  function resetAnimation() {
    timers.forEach(timer => clearTimeout(timer));
    timers = [];
    currentStep = 0;

    document.getElementById("stepTitle").innerHTML = "Ready";
    document.getElementById("stepText").innerHTML = "Click Start to begin the animation.";
    document.getElementById("formulaBox").innerHTML = "R = U / I";
    document.getElementById("resultBox").innerHTML = "Waiting...";
    document.getElementById("footerBox").innerHTML = "Final result will appear here.";

    document.querySelectorAll(".electron").forEach(e => {
      e.classList.remove("run");
    });

    document.querySelectorAll(".fade").forEach(e => {
      e.classList.remove("show");
      e.classList.remove("pulse");
    });

    document.querySelectorAll(".bar").forEach(e => {
      e.classList.remove("show");
    });
  }
</script>

</body>
</html>
