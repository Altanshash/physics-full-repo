<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Problem 10 Stability Analysis</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .panel {
      background: #1f2937;
      padding: 15px;
      border-radius: 12px;
    }

    canvas {
      background: white;
      border-radius: 8px;
      border: 2px solid #374151;
    }

    .controls {
      max-width: 900px;
      margin: 10px auto 30px;
      background: #1f2937;
      padding: 20px;
      border-radius: 12px;
    }

    .control {
      text-align: left;
      margin: 14px 0;
    }

    input, select {
      width: 100%;
      padding: 6px;
    }

    button {
      margin: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .value {
      color: #93c5fd;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Problem 10 — Stability Analysis and Conserved Quantities</h1>

  <div class="container">
    <div class="panel">
      <h2>Three-body motion</h2>
      <canvas id="orbitCanvas" width="620" height="620"></canvas>
    </div>

    <div class="panel">
      <h2>Stability monitor</h2>
      <canvas id="monitorCanvas" width="620" height="620"></canvas>
    </div>
  </div>

  <div class="controls">
    <div class="control">
      <label>Time step Δt: <span id="dtValue" class="value"></span></label>
      <input type="range" id="dt" min="0.002" max="0.04" step="0.001" value="0.01">
    </div>

    <div class="control">
      <label>Integration method:</label>
      <select id="method">
        <option value="rk4">RK4 — more stable</option>
        <option value="euler">Euler — less stable</option>
      </select>
    </div>

    <div class="control">
      <label>Speed: <span id="speedValue" class="value"></span></label>
      <input type="range" id="speed" min="1" max="8" value="3">
    </div>

    <button onclick="toggleAnimation()">Pause / Play</button>
    <button onclick="resetSimulation()">Reset</button>
  </div>

  <script>
    const orbitCanvas = document.getElementById("orbitCanvas");
    const orbitCtx = orbitCanvas.getContext("2d");

    const monitorCanvas = document.getElementById("monitorCanvas");
    const monitorCtx = monitorCanvas.getContext("2d");

    const dtSlider = document.getElementById("dt");
    const methodSelect = document.getElementById("method");
    const speedSlider = document.getElementById("speed");

    const dtValue = document.getElementById("dtValue");
    const speedValue = document.getElementById("speedValue");

    const G = 80;
    const softening = 25;

    let bodies = [];
    let running = true;

    let E0 = 0;
    let L0 = 0;
    let CM0 = { x: 0, y: 0 };

    let energyError = [];
    let momentumError = [];
    let cmDrift = [];

    function values() {
      return {
        dt: Number(dtSlider.value),
        method: methodSelect.value,
        speed: Number(speedSlider.value)
      };
    }

    function resetSimulation() {
      bodies = [
        { m: 12, x: -120, y: 0, vx: 0, vy: 1.15, color: "#2563eb", trace: [] },
        { m: 12, x: 120, y: 0, vx: 0, vy: -1.15, color: "#dc2626", trace: [] },
        { m: 12, x: 0, y: 150, vx: -1.25, vy: 0, color: "#16a34a", trace: [] }
      ];

      removeCenterMotion();

      E0 = totalEnergy();
      L0 = angularMomentum();
      CM0 = centerOfMass();

      energyError = [];
      momentumError = [];
      cmDrift = [];
      running = true;
    }

    function removeCenterMotion() {
      let M = 0, px = 0, py = 0;

      for (let b of bodies) {
        M += b.m;
        px += b.m * b.vx;
        py += b.m * b.vy;
      }

      const vxCM = px / M;
      const vyCM = py / M;

      for (let b of bodies) {
        b.vx -= vxCM;
        b.vy -= vyCM;
      }
    }

    function acceleration(state) {
      const acc = state.map(() => ({ ax: 0, ay: 0 }));

      for (let i = 0; i < state.length; i++) {
        for (let j = 0; j < state.length; j++) {
          if (i === j) continue;

          const dx = state[j].x - state[i].x;
          const dy = state[j].y - state[i].y;

          const r2 = dx * dx + dy * dy + softening;
          const r = Math.sqrt(r2);

          const factor = G * state[j].m / (r2 * r);

          acc[i].ax += factor * dx;
          acc[i].ay += factor * dy;
        }
      }

      return acc;
    }

    function cloneState() {
      return bodies.map(b => ({
        m: b.m,
        x: b.x,
        y: b.y,
        vx: b.vx,
        vy: b.vy
      }));
    }

    function derivative(state) {
      const acc = acceleration(state);

      return state.map((b, i) => ({
        dx: b.vx,
        dy: b.vy,
        dvx: acc[i].ax,
        dvy: acc[i].ay
      }));
    }

    function addState(state, k, scale) {
      return state.map((b, i) => ({
        m: b.m,
        x: b.x + k[i].dx * scale,
        y: b.y + k[i].dy * scale,
        vx: b.vx + k[i].dvx * scale,
        vy: b.vy + k[i].dvy * scale
      }));
    }

    function rk4Step(dt) {
      const s0 = cloneState();

      const k1 = derivative(s0);
      const k2 = derivative(addState(s0, k1, dt / 2));
      const k3 = derivative(addState(s0, k2, dt / 2));
      const k4 = derivative(addState(s0, k3, dt));

      for (let i = 0; i < bodies.length; i++) {
        bodies[i].x += dt / 6 * (k1[i].dx + 2*k2[i].dx + 2*k3[i].dx + k4[i].dx);
        bodies[i].y += dt / 6 * (k1[i].dy + 2*k2[i].dy + 2*k3[i].dy + k4[i].dy);

        bodies[i].vx += dt / 6 * (k1[i].dvx + 2*k2[i].dvx + 2*k3[i].dvx + k4[i].dvx);
        bodies[i].vy += dt / 6 * (k1[i].dvy + 2*k2[i].dvy + 2*k3[i].dvy + k4[i].dvy);
      }
    }

    function eulerStep(dt) {
      const acc = acceleration(cloneState());

      for (let i = 0; i < bodies.length; i++) {
        bodies[i].vx += acc[i].ax * dt;
        bodies[i].vy += acc[i].ay * dt;

        bodies[i].x += bodies[i].vx * dt;
        bodies[i].y += bodies[i].vy * dt;
      }
    }

    function totalEnergy() {
      let K = 0;
      let U = 0;

      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];

        K += 0.5 * b.m * (b.vx*b.vx + b.vy*b.vy);

        for (let j = i + 1; j < bodies.length; j++) {
          const c = bodies[j];

          const dx = c.x - b.x;
          const dy = c.y - b.y;

          const r = Math.sqrt(dx*dx + dy*dy + softening);

          U += -G * b.m * c.m / r;
        }
      }

      return K + U;
    }

    function angularMomentum() {
      let L = 0;

      for (let b of bodies) {
        L += b.m * (b.x * b.vy - b.y * b.vx);
      }

      return L;
    }

    function centerOfMass() {
      let M = 0;
      let x = 0;
      let y = 0;

      for (let b of bodies) {
        M += b.m;
        x += b.m * b.x;
        y += b.m * b.y;
      }

      return { x: x / M, y: y / M };
    }

    function step() {
      const v = values();

      if (v.method === "rk4") {
        rk4Step(v.dt);
      } else {
        eulerStep(v.dt);
      }

      for (let b of bodies) {
        b.trace.push({ x: b.x, y: b.y });

        if (b.trace.length > 900) {
          b.trace.shift();
        }
      }

      const E = totalEnergy();
      const L = angularMomentum();
      const CM = centerOfMass();

      energyError.push(Math.abs(E - E0));
      momentumError.push(Math.abs(L - L0));
      cmDrift.push(Math.sqrt((CM.x - CM0.x)**2 + (CM.y - CM0.y)**2));

      if (energyError.length > 500) energyError.shift();
      if (momentumError.length > 500) momentumError.shift();
      if (cmDrift.length > 500) cmDrift.shift();
    }

    function drawOrbit() {
      const w = orbitCanvas.width;
      const h = orbitCanvas.height;
      const cx = w / 2;
      const cy = h / 2;

      orbitCtx.clearRect(0, 0, w, h);

      orbitCtx.strokeStyle = "#e5e7eb";
      orbitCtx.beginPath();
      orbitCtx.moveTo(0, cy);
      orbitCtx.lineTo(w, cy);
      orbitCtx.moveTo(cx, 0);
      orbitCtx.lineTo(cx, h);
      orbitCtx.stroke();

      orbitCtx.fillStyle = "#111827";
      orbitCtx.font = "15px Arial";
      orbitCtx.fillText("Yellow = center of mass", 20, 30);
      orbitCtx.fillText("Three colored curves = trajectories", 20, 55);

      const CM = centerOfMass();

      orbitCtx.fillStyle = "#f59e0b";
      orbitCtx.beginPath();
      orbitCtx.arc(cx + CM.x, cy - CM.y, 7, 0, Math.PI * 2);
      orbitCtx.fill();

      for (let b of bodies) {
        if (b.trace.length > 1) {
          orbitCtx.strokeStyle = b.color;
          orbitCtx.lineWidth = 2;
          orbitCtx.beginPath();

          for (let i = 0; i < b.trace.length; i++) {
            const p = b.trace[i];

            if (i === 0) orbitCtx.moveTo(cx + p.x, cy - p.y);
            else orbitCtx.lineTo(cx + p.x, cy - p.y);
          }

          orbitCtx.stroke();
        }

        orbitCtx.fillStyle = b.color;
        orbitCtx.beginPath();
        orbitCtx.arc(cx + b.x, cy - b.y, 8, 0, Math.PI * 2);
        orbitCtx.fill();
      }
    }

    function drawMonitor() {
      const w = monitorCanvas.width;
      const h = monitorCanvas.height;

      monitorCtx.clearRect(0, 0, w, h);

      monitorCtx.fillStyle = "#111827";
      monitorCtx.font = "16px Arial";

      const Eerr = energyError.length ? energyError[energyError.length - 1] : 0;
      const Lerr = momentumError.length ? momentumError[momentumError.length - 1] : 0;
      const Cerr = cmDrift.length ? cmDrift[cmDrift.length - 1] : 0;

      monitorCtx.fillText("Numerical stability indicators", 20, 30);
      monitorCtx.fillText("Smaller values mean better conservation.", 20, 55);

      drawBar("Energy error |E - E₀|", Eerr, 0, 100, 110);
      drawBar("Angular momentum error |L - L₀|", Lerr, 0, 100, 210);
      drawBar("Center of mass drift", Cerr, 0, 50, 310);

      monitorCtx.fillStyle = "#111827";
      monitorCtx.font = "15px Arial";
      monitorCtx.fillText("Method: " + values().method.toUpperCase(), 20, 440);
      monitorCtx.fillText("Δt = " + values().dt.toFixed(3), 20, 465);

      if (values().method === "rk4") {
        monitorCtx.fillText("RK4 usually keeps errors small.", 20, 500);
      } else {
        monitorCtx.fillText("Euler usually grows errors faster.", 20, 500);
      }
    }

    function drawBar(label, value, min, max, y) {
      const x = 40;
      const width = 520;
      const height = 28;

      const ratio = Math.min(value / max, 1);

      monitorCtx.fillStyle = "#111827";
      monitorCtx.font = "15px Arial";
      monitorCtx.fillText(label + ": " + value.toFixed(4), x, y - 15);

      monitorCtx.strokeStyle = "#111827";
      monitorCtx.strokeRect(x, y, width, height);

      monitorCtx.fillStyle = "#7c3aed";
      monitorCtx.fillRect(x, y, width * ratio, height);
    }

    function animate() {
      const v = values();

      dtValue.textContent = v.dt.toFixed(3);
      speedValue.textContent = v.speed;

      if (running) {
        for (let i = 0; i < v.speed; i++) {
          step();
        }
      }

      drawOrbit();
      drawMonitor();

      requestAnimationFrame(animate);
    }

    function toggleAnimation() {
      running = !running;
    }

    dtSlider.addEventListener("input", resetSimulation);
    methodSelect.addEventListener("change", resetSimulation);

    resetSimulation();
    animate();
  </script>
</body>
</html>
