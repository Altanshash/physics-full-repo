<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Dilation Animation</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 25px;
      color: #7dd3fc;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      background: #111827;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(125, 211, 252, 0.3);
    }

    .space {
      position: relative;
      height: 220px;
      background: linear-gradient(to right, #020617, #1e293b);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
    }

    .earth {
      position: absolute;
      left: 30px;
      bottom: 35px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #22c55e, #2563eb);
      border-radius: 50%;
      box-shadow: 0 0 25px #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .ship {
      position: absolute;
      top: 85px;
      left: 120px;
      font-size: 45px;
      animation: moveShip 6s linear infinite;
    }

    @keyframes moveShip {
      0% {
        left: 120px;
      }
      100% {
        left: 760px;
      }
    }

    .clocks {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .clock-box {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 280px;
      border: 1px solid #475569;
    }

    .clock-title {
      color: #facc15;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .time {
      font-size: 34px;
      color: #38bdf8;
      font-weight: bold;
    }

    .formula {
      margin-top: 30px;
      background: #020617;
      padding: 20px;
      border-radius: 12px;
      font-size: 20px;
      line-height: 1.8;
    }

    .result {
      margin-top: 20px;
      font-size: 22px;
      color: #86efac;
      font-weight: bold;
    }

    button {
      margin-top: 25px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <h1>Relativistic Time Dilation</h1>

  <div class="container">

    <h2>Spacecraft velocity: v = 0.8c</h2>

    <div class="space">
      <div class="earth">Earth</div>
      <div class="ship">🚀</div>
    </div>

    <div class="clocks">
      <div class="clock-box">
        <div class="clock-title">Time on Spacecraft</div>
        <div class="time" id="shipTime">0.00</div>
        <p>years</p>
      </div>

      <div class="clock-box">
        <div class="clock-title">Time on Earth</div>
        <div class="time" id="earthTime">0.00</div>
        <p>years</p>
      </div>
    </div>

    <div class="formula">
      Lorentz factor:
      <br>
      γ = 1 / √(1 − v² / c²)
      <br>
      γ = 1 / √(1 − 0.8²)
      <br>
      γ ≈ 1.67
    </div>

    <div class="result">
      If 5 years pass on the spacecraft, 8.33 years pass on Earth.
      <br>
      Time dilation effect: 66.7%
    </div>

    <button onclick="restartAnimation()">Restart Animation</button>

  </div>

  <script>
    let shipTime = 0;
    let earthTime = 0;

    const gamma = 1.67;
    const maxShipTime = 5;
    const maxEarthTime = 8.33;

    let animation;

    function startAnimation() {
      shipTime = 0;
      earthTime = 0;

      clearInterval(animation);

      animation = setInterval(() => {
        shipTime += 0.05;
        earthTime = shipTime * gamma;

        if (shipTime >= maxShipTime) {
          shipTime = maxShipTime;
          earthTime = maxEarthTime;
          clearInterval(animation);
        }

        document.getElementById("shipTime").textContent = shipTime.toFixed(2);
        document.getElementById("earthTime").textContent = earthTime.toFixed(2);
      }, 60);
    }

    function restartAnimation() {
      startAnimation();
    }

    startAnimation();
  </script>

</body>
</html>
