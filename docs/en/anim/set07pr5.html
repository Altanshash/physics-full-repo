<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Correct Current Split</title>

<style>
body{
    margin:0;
    background:#050816;
    font-family:Arial;
    color:white;
    overflow:hidden;
}

h1{
    text-align:center;
    color:#00e5ff;
    text-shadow:0 0 10px cyan;
}

.panel{
    position:absolute;
    left:20px;
    top:80px;
    width:300px;
    padding:15px;
    background:rgba(255,255,255,0.05);
    border:1px solid cyan;
    border-radius:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#00cfff;
    border:none;
    color:white;
    cursor:pointer;
}

svg{
    width:100vw;
    height:100vh;
}

/* WIRES */
.wire{
    stroke:#00d9ff;
    stroke-width:5;
    fill:none;
}

/* MOVING CURRENT */
.dot{
    width:10px;
    height:10px;
    background:cyan;
    border-radius:50%;
    position:absolute;
    box-shadow:0 0 10px cyan;
}

/* PATHS */
.top{
    position:absolute;
    offset-path:path("M350 350 H500 V150 H900 V350");
}

.bottom{
    position:absolute;
    offset-path:path("M350 350 H500 V550 H900 V350");
}

.run{
    animation:move 3s linear infinite;
}

@keyframes move{
    from{ offset-distance:0%; }
    to{ offset-distance:100%; }
}

</style>
</head>

<body>

<h1>Current Split Circuit (Fixed)</h1>

<div class="panel">

<h3>Берілгені:</h3>
<p>R1 = 10Ω</p>
<p>R2 = 10Ω</p>
<p>R3 = 10Ω</p>

<p>R параллель = 5Ω</p>
<p>R жалпы = 10Ω</p>

<p><b>U = 10V</b></p>
<p><b>I = 1A</b></p>
<p>I бөлінеді: 0.5A + 0.5A</p>

<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>

</div>

<!-- CURRENT DOTS -->
<div id="t1" class="dot top"></div>
<div id="t2" class="dot top"></div>

<div id="b1" class="dot bottom"></div>
<div id="b2" class="dot bottom"></div>

<script>

let topDots = [t1,t2];
let bottomDots = [b1,b2];

function start(){

    topDots.forEach((d,i)=>{
        d.classList.add("run");
        d.style.animationDelay = (i*1.2)+"s";
    });

    bottomDots.forEach((d,i)=>{
        d.classList.add("run");
        d.style.animationDelay = (i*1.2)+"s";
    });
}

function stop(){

    [...topDots,...bottomDots].forEach(d=>{
        d.classList.remove("run");
    });
}

</script>

</body>
</html>
