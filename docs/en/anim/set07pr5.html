<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Current Split Correct Animation</title>

<style>
body {
    margin: 0;
    background: #050816;
    overflow: hidden;
    font-family: Arial;
    color: white;
}

h1 {
    text-align: center;
    color: #00e5ff;
    text-shadow: 0 0 10px cyan;
}

svg {
    width: 100vw;
    height: 100vh;
}

.wire {
    stroke: #00d9ff;
    stroke-width: 5;
    fill: none;
    filter: drop-shadow(0 0 8px cyan);
}

.node {
    fill: #00e5ff;
}

.dot {
    fill: cyan;
    filter: drop-shadow(0 0 8px cyan);
}
</style>
</head>

<body>

<h1>Correct Current Splitting Animation</h1>

<svg viewBox="0 0 1200 700">

<!-- MAIN WIRE -->
<path id="start" class="wire" d="M200 350 H350"/>

<!-- SPLIT POINT -->
<circle cx="350" cy="350" r="6" class="node"/>

<!-- TOP PATH -->
<path id="topPath" class="wire"
d="M350 350 H500 V150 H900 V350"/>

<!-- BOTTOM PATH -->
<path id="bottomPath" class="wire"
d="M350 350 H500 V550 H900 V350"/>

<!-- MERGE -->
<path class="wire" d="M900 350 H1050"/>

<!-- ===== MOVING CHARGES (TOP) ===== -->
<circle r="6" class="dot">
    <animateMotion dur="4s" repeatCount="indefinite">
        <mpath href="#topPath"/>
    </animateMotion>
</circle>

<circle r="6" class="dot">
    <animateMotion dur="4s" begin="1s" repeatCount="indefinite">
        <mpath href="#topPath"/>
    </animateMotion>
</circle>

<circle r="6" class="dot">
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite">
        <mpath href="#topPath"/>
    </animateMotion>
</circle>

<!-- ===== MOVING CHARGES (BOTTOM) ===== -->
<circle r="6" class="dot">
    <animateMotion dur="4s" repeatCount="indefinite">
        <mpath href="#bottomPath"/>
    </animateMotion>
</circle>

<circle r="6" class="dot">
    <animateMotion dur="4s" begin="1s" repeatCount="indefinite">
        <mpath href="#bottomPath"/>
    </animateMotion>
</circle>

<circle r="6" class="dot">
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite">
        <mpath href="#bottomPath"/>
    </animateMotion>
</circle>

</svg>

</body>
</html>
