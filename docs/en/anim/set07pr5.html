<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Current Split Circuit</title>

<style>
body{
    margin:0;
    background:#050816;
    font-family:Arial;
    color:white;
    overflow:hidden;
}

h1{
    text-align:center;
    color:#00e5ff;
    text-shadow:0 0 10px cyan;
}

.panel{
    position:absolute;
    left:20px;
    top:80px;
    width:300px;
    background:rgba(255,255,255,0.05);
    padding:15px;
    border-radius:10px;
    border:1px solid cyan;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#00cfff;
    border:none;
    color:white;
    cursor:pointer;
}

svg{
    width:100vw;
    height:100vh;
}

.wire{
    stroke:#00d9ff;
    stroke-width:5;
    fill:none;
}

.node{
    fill:#00e5ff;
}

.dot{
    fill:cyan;
}

</style>
</head>

<body>

<h1>Current Splitting Circuit</h1>

<div class="panel">

<h3>Берілгені:</h3>
<p>R1 = 10 Ω (жоғарғы)</p>
<p>R2 = 10 Ω</p>
<p>R3 = 10 Ω</p>

<p>Параллель: 10Ω || 10Ω = 5Ω</p>
<p>Жалпы: 5Ω + 5Ω = 10Ω</p>

<p><b>U = 10V</b></p>
<p><b>I = U / R = 10 / 10 = 1A</b></p>

<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>

</div>

<svg viewBox="0 0 1200 700">

<!-- WIRES -->
<path class="wire" d="M200 350 H350"/>
<circle cx="350" cy="350" r="5" class="node"/>

<path id="topPath" class="wire"
d="M350 350 H500 V150 H900 V350"/>

<path id="bottomPath" class="wire"
d="M350 350 H500 V550 H900 V350"/>

<path class="wire" d="M900 350 H1050"/>

<!-- RESISTORS -->
<rect x="550" y="120" width="80" height="30" fill="none" stroke="cyan"/>
<text x="550" y="110" fill="white">10Ω</text>

<rect x="550" y="520" width="80" height="30" fill="none" stroke="cyan"/>
<text x="550" y="510" fill="white">10Ω</text>

<!-- CURRENT TEXT -->
<text x="420" y="80" fill="cyan" font-size="18">
I = 1A (splits into 0.5A + 0.5A)
</text>

</svg>

<script>

let running = false;

function createDot(pathId, delay){

    const dot = document.createElementNS("http://www.w3.org/2000/svg","circle");

    dot.setAttribute("r",5);
    dot.setAttribute("fill","cyan");

    const anim = document.createElementNS("http://www.w3.org/2000/svg","animateMotion");
    anim.setAttribute("dur","3s");
    anim.setAttribute("repeatCount","indefinite");
    anim.setAttribute("begin",delay+"s");

    const mpath = document.createElementNS("http://www.w3.org/2000/svg","mpath");
    mpath.setAttribute("href","#"+pathId);

    anim.appendChild(mpath);
    dot.appendChild(anim);

    document.querySelector("svg").appendChild(dot);

    return dot;
}

let dots = [];

function start(){

    if(running) return;
    running = true;

    // TOP branch (0.5A)
    dots.push(createDot("topPath",0));
    dots.push(createDot("topPath",1));
    dots.push(createDot("topPath",2));

    // BOTTOM branch (0.5A)
    dots.push(createDot("bottomPath",0));
    dots.push(createDot("bottomPath",1));
    dots.push(createDot("bottomPath",2));
}

function stop(){

    dots.forEach(d => d.remove());
    dots = [];
    running = false;
}

</script>

</body>
</html>
