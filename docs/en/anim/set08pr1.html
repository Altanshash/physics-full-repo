<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Graph Animation</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="background:#111; color:white; font-family:Arial; text-align:center;">

  <h2>Measurement Graph Animation</h2>

  <canvas id="chart" width="700" height="350"></canvas>

  <br><br>
  <button onclick="startAnimation()">Start</button>

  <p>
    Conclusion: The points are close to the mean line, so the result is precise and reliable.
  </p>

<script>
const values = [12.10, 12.08, 12.12, 12.11, 12.09, 12.13, 12.07, 12.10];
const mean = 12.10;

let chart = new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: [1,2,3,4,5,6,7,8],
    datasets: [
      {
        label: "Measurements",
        data: [],
        borderColor: "cyan",
        backgroundColor: "cyan",
        pointRadius: 6,
        tension: 0.3
      },
      {
        label: "Mean",
        data: [mean, mean, mean, mean, mean, mean, mean, mean],
        borderColor: "lime",
        borderDash: [6,6],
        pointRadius: 0
      }
    ]
  },
  options: {
    scales: {
      y: {
        min: 12.04,
        max: 12.16,
        ticks: { color: "white" }
      },
      x: {
        ticks: { color: "white" }
      }
    },
    plugins: {
      legend: {
        labels: { color: "white" }
      }
    }
  }
});

function startAnimation() {
  chart.data.datasets[0].data = [];

  let i = 0;
  let timer = setInterval(() => {
    chart.data.datasets[0].data.push(values[i]);
    chart.update();

    i++;

    if (i === values.length) {
      clearInterval(timer);
    }
  }, 500);
}
</script>

</body>
</html>
