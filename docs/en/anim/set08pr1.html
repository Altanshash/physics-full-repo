<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="margin:0;background:#020617;display:flex;justify-content:center;align-items:center;height:100vh;">

  <canvas id="chart" style="width:700px;height:400px;"></canvas>

<script>
const ctx = document.getElementById("chart");

new Chart(ctx, {
  type: "line",
  data: {
    labels: ["1","2","3","4","5","6","7","8"],
    datasets: [
      {
        label: "Measurements",
        data: [12.10, 12.08, 12.12, 12.11, 12.09, 12.13, 12.07, 12.10],
        borderColor: "cyan",
        backgroundColor: "cyan",
        pointRadius: 6,
        tension: 0.3
      },
      {
        label: "Mean",
        data: [12.10,12.10,12.10,12.10,12.10,12.10,12.10,12.10],
        borderColor: "lime",
        borderDash: [6,6],
        pointRadius: 0
      }
    ]
  },
  options: {
    responsive: false,
    scales: {
      y: {
        min: 12.06,
        max: 12.14,
        ticks: { color: "white" },
        grid: { color: "#1e293b" }
      },
      x: {
        ticks: { color: "white" },
        grid: { color: "#1e293b" }
      }
    },
    plugins: {
      legend: {
        labels: { color: "white" }
      }
    }
  }
});
</script>

</body>
</html>
