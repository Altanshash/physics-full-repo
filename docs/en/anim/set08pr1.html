<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Statistics Graph Animation</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020617;
    color: white;
  }

  .container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
  }

  h1 {
    text-align: center;
    color: #38bdf8;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  .card {
    background: #0f172a;
    border: 1px solid #38bdf8;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 0 25px rgba(56,189,248,0.25);
  }

  h2 {
    text-align: center;
    color: #93c5fd;
  }

  canvas {
    height: 380px !important;
  }

  button {
    display: block;
    margin: 25px auto;
    padding: 14px 34px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    cursor: pointer;
  }

  .conclusion {
    margin-top: 25px;
    background: #0f172a;
    border: 1px solid #22c55e;
    border-radius: 18px;
    padding: 22px;
    font-size: 18px;
    line-height: 1.7;
    text-align: center;
  }

  .green {
    color: #22c55e;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="container">

  <h1>Graphical Statistics Animation</h1>

  <button onclick="startAnimation()">Start Animation</button>

  <div class="grid">
    <div class="card">
      <h2>Measurement Scatter Plot</h2>
      <canvas id="scatterChart"></canvas>
    </div>

    <div class="card">
      <h2>Normal Distribution</h2>
      <canvas id="normalChart"></canvas>
    </div>
  </div>

  <div class="conclusion">
    <h2>Conclusion</h2>
    The measurement points are close to the mean value.
    The result is <span class="green">stable, precise, and reliable</span>.
    <br><br>
    Final value:
    <span class="green">12.10 ± 0.007 cm</span>
  </div>

</div>

<script>
const measurements = [12.10, 12.08, 12.12, 12.11, 12.09, 12.13, 12.07, 12.10];

const mean = 12.10;
const std = 0.02;

let scatterChart;
let normalChart;

function createScatterChart(count) {
  const points = measurements.slice(0, count).map((value, index) => ({
    x: index + 1,
    y: value
  }));

  const meanLine = count >= measurements.length
    ? [{x: 1, y: mean}, {x: 8, y: mean}]
    : [];

  if (scatterChart) scatterChart.destroy();

  scatterChart = new Chart(document.getElementById("scatterChart"), {
    type: "scatter",
    data: {
      datasets: [
        {
          label: "Measurements",
          data: points,
          pointRadius: 9,
          pointBackgroundColor: "#22d3ee",
          pointBorderColor: "#ffffff",
          pointBorderWidth: 2
        },
        {
          label: "Mean line",
          data: meanLine,
          type: "line",
          borderColor: "#22c55e",
          borderWidth: 3,
          borderDash: [8, 6],
          pointRadius: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 600 },
      scales: {
        x: {
          min: 0,
          max: 9,
          title: { display: true, text: "Measurement Number", color: "white" },
          ticks: { color: "white" },
          grid: { color: "#1e293b" }
        },
        y: {
          min: 12.04,
          max: 12.16,
          title: { display: true, text: "Length (cm)", color: "white" },
          ticks: { color: "white" },
          grid: { color: "#1e293b" }
        }
      },
      plugins: {
        legend: { labels: { color: "white" } }
      }
    }
  });
}

function normalPDF(x) {
  return Math.exp(-0.5 * Math.pow((x - mean) / std, 2));
}

function createNormalChart(stage) {
  const curve = [];

  for (let x = 12.02; x <= 12.18; x += 0.001) {
    curve.push({ x: x, y: normalPDF(x) });
  }

  const datasets = [];

  if (stage >= 1) {
    datasets.push({
      label: "Normal Curve",
      data: curve,
      type: "line",
      borderColor: "#60a5fa",
      borderWidth: 4,
      pointRadius: 0,
      tension: 0.35
    });
  }

  if (stage >= 2) {
    datasets.push({
      label: "68% interval",
      data: [
        {x: mean - std, y: 0},
        {x: mean - std, y: 1},
        {x: mean + std, y: 1},
        {x: mean + std, y: 0}
      ],
      type: "line",
      borderColor: "#22c55e",
      backgroundColor: "rgba(34,197,94,0.25)",
      fill: true,
      pointRadius: 0
    });
  }

  if (stage >= 3) {
    datasets.push({
      label: "95% interval",
      data: [
        {x: mean - 2 * std, y: 0},
        {x: mean - 2 * std, y: 0.55},
        {x: mean + 2 * std, y: 0.55},
        {x: mean + 2 * std, y: 0}
      ],
      type: "line",
      borderColor: "#facc15",
      backgroundColor: "rgba(250,204,21,0.18)",
      fill: true,
      pointRadius: 0
    });
  }

  if (stage >= 4) {
    datasets.push({
      label: "99% interval",
      data: [
        {x: mean - 3 * std, y: 0},
        {x: mean - 3 * std, y: 0.3},
        {x: mean + 3 * std, y: 0.3},
        {x: mean + 3 * std, y: 0}
      ],
      type: "line",
      borderColor: "#ec4899",
      backgroundColor: "rgba(236,72,153,0.15)",
      fill: true,
      pointRadius: 0
    });
  }

  if (normalChart) normalChart.destroy();

  normalChart = new Chart(document.getElementById("normalChart"), {
    type: "line",
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 900 },
      scales: {
        x: {
          type: "linear",
          min: 12.02,
          max: 12.18,
          title: { display: true, text: "Length (cm)", color: "white" },
          ticks: { color: "white" },
          grid: { color: "#1e293b" }
        },
        y: {
          min: 0,
          max: 1.1,
          title: { display: true, text: "Density", color: "white" },
          ticks: { color: "white" },
          grid: { color: "#1e293b" }
        }
      },
      plugins: {
        legend: { labels: { color: "white" } }
      }
    }
  });
}

function startAnimation() {
  createScatterChart(0);
  createNormalChart(0);

  let count = 0;

  const timer = setInterval(() => {
    count++;
    createScatterChart(count);

    if (count === measurements.length) {
      clearInterval(timer);

      setTimeout(() => createNormalChart(1), 700);
      setTimeout(() => createNormalChart(2), 1600);
      setTimeout(() => createNormalChart(3), 2500);
      setTimeout(() => createNormalChart(4), 3400);
    }
  }, 550);
}

createScatterChart(0);
createNormalChart(0);
</script>

</body>
</html>
