<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Measurement Animation</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body {
    margin: 0;
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
  }

  .container {
    width: 95%;
    max-width: 1200px;
    margin: auto;
    padding: 30px;
  }

  h1 {
    text-align: center;
    color: #38bdf8;
    margin-bottom: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  .card {
    background: #0f172a;
    border: 1px solid #2563eb;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 0 25px rgba(37, 99, 235, 0.35);
  }

  h2 {
    color: #93c5fd;
    text-align: center;
  }

  canvas {
    background: #020617;
    border-radius: 12px;
  }

  button {
    display: block;
    margin: 25px auto;
    padding: 14px 32px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    cursor: pointer;
  }

  button:hover {
    background: #1d4ed8;
  }

  .legend {
    text-align: center;
    margin-top: 15px;
    color: #cbd5e1;
    font-size: 16px;
  }
</style>
</head>

<body>

<div class="container">

  <h1>Graphical Animation of Measurement Data</h1>

  <button onclick="startAnimation()">Start Animation</button>

  <div class="grid">

    <div class="card">
      <h2>Measurement Points</h2>
      <canvas id="scatterChart"></canvas>
      <div class="legend">Points appear one by one, then the mean line is shown.</div>
    </div>

    <div class="card">
      <h2>Distribution and Intervals</h2>
      <canvas id="normalChart"></canvas>
      <div class="legend">Normal curve and confidence intervals appear step by step.</div>
    </div>

  </div>

</div>

<script>
const measurements = [12.10, 12.08, 12.12, 12.11, 12.09, 12.13, 12.07, 12.10];

const mean = 12.10;
const std = 0.02;

let scatterChart;
let normalChart;

function createScatterChart(count) {
  const visiblePoints = measurements.slice(0, count).map((value, index) => {
    return {
      x: index + 1,
      y: value
    };
  });

  const meanLine = count >= measurements.length ? [
    { x: 1, y: mean },
    { x: 8, y: mean }
  ] : [];

  if (scatterChart) scatterChart.destroy();

  scatterChart = new Chart(document.getElementById("scatterChart"), {
    type: "scatter",
    data: {
      datasets: [
        {
          label: "Measurements",
          data: visiblePoints,
          pointRadius: 8,
          pointHoverRadius: 10,
          pointBackgroundColor: "#22d3ee"
        },
        {
          label: "Mean",
          data: meanLine,
          type: "line",
          borderColor: "#22c55e",
          borderWidth: 3,
          borderDash: [8, 5],
          pointRadius: 0
        }
      ]
    },
    options: {
      animation: {
        duration: 600
      },
      scales: {
        x: {
          min: 0,
          max: 9,
          title: {
            display: true,
            text: "Measurement Number",
            color: "#e5e7eb"
          },
          ticks: { color: "#e5e7eb" },
          grid: { color: "#1e293b" }
        },
        y: {
          min: 12.04,
          max: 12.16,
          title: {
            display: true,
            text: "Length (cm)",
            color: "#e5e7eb"
          },
          ticks: { color: "#e5e7eb" },
          grid: { color: "#1e293b" }
        }
      },
      plugins: {
        legend: {
          labels: { color: "#e5e7eb" }
        }
      }
    }
  });
}

function normalFunction(x) {
  return Math.exp(-0.5 * Math.pow((x - mean) / std, 2));
}

function generateCurve() {
  const curve = [];

  for (let x = 12.02; x <= 12.18; x += 0.002) {
    curve.push({
      x: x,
      y: normalFunction(x)
    });
  }

  return curve;
}

function intervalArea(left, right, height) {
  return [
    { x: left, y: 0 },
    { x: left, y: height },
    { x: right, y: height },
    { x: right, y: 0 }
  ];
}

function createNormalChart(stage) {
  const datasets = [];

  if (stage >= 1) {
    datasets.push({
      label: "Normal Curve",
      data: generateCurve(),
      type: "line",
      borderColor: "#60a5fa",
      borderWidth: 3,
      pointRadius: 0,
      tension: 0.35
    });
  }

  if (stage >= 2) {
    datasets.push({
      label: "±1σ",
      data: intervalArea(mean - std, mean + std, 1),
      type: "line",
      borderColor: "#22c55e",
      backgroundColor: "rgba(34, 197, 94, 0.25)",
      fill: true,
      pointRadius: 0
    });
  }

  if (stage >= 3) {
    datasets.push({
      label: "±2σ",
      data: intervalArea(mean - 2 * std, mean + 2 * std, 0.55),
      type: "line",
      borderColor: "#facc15",
      backgroundColor: "rgba(250, 204, 21, 0.18)",
      fill: true,
      pointRadius: 0
    });
  }

  if (stage >= 4) {
    datasets.push({
      label: "±3σ",
      data: intervalArea(mean - 3 * std, mean + 3 * std, 0.3),
      type: "line",
      borderColor: "#ec4899",
      backgroundColor: "rgba(236, 72, 153, 0.15)",
      fill: true,
      pointRadius: 0
    });
  }

  if (normalChart) normalChart.destroy();

  normalChart = new Chart(document.getElementById("normalChart"), {
    type: "line",
    data: { datasets },
    options: {
      animation: {
        duration: 900
      },
      scales: {
        x: {
          type: "linear",
          min: 12.02,
          max: 12.18,
          title: {
            display: true,
            text: "Length (cm)",
            color: "#e5e7eb"
          },
          ticks: { color: "#e5e7eb" },
          grid: { color: "#1e293b" }
        },
        y: {
          min: 0,
          max: 1.1,
          title: {
            display: true,
            text: "Density",
            color: "#e5e7eb"
          },
          ticks: { color: "#e5e7eb" },
          grid: { color: "#1e293b" }
        }
      },
      plugins: {
        legend: {
          labels: { color: "#e5e7eb" }
        }
      }
    }
  });
}

function startAnimation() {
  createScatterChart(0);
  createNormalChart(0);

  let count = 0;

  const pointAnimation = setInterval(() => {
    count++;
    createScatterChart(count);

    if (count === measurements.length) {
      clearInterval(pointAnimation);

      setTimeout(() => createNormalChart(1), 800);
      setTimeout(() => createNormalChart(2), 1800);
      setTimeout(() => createNormalChart(3), 2800);
      setTimeout(() => createNormalChart(4), 3800);
    }
  }, 600);
}

createScatterChart(0);
createNormalChart(0);
</script>

</body>
</html>
