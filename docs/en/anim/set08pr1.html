<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Statistics Graph Animation</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body{
    margin:0;
    background:#020617;
    font-family:Arial,sans-serif;
    overflow:hidden;
    color:white;
  }

  .container{
    width:95%;
    max-width:1400px;
    margin:auto;
    padding:20px;
  }

  h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:20px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
  }

  .card{
    background:#0f172a;
    border:1px solid #38bdf8;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 30px rgba(56,189,248,0.25);
  }

  h2{
    text-align:center;
    color:#93c5fd;
  }

  canvas{
    height:500px !important;
  }

  button{
    display:block;
    margin:20px auto;
    padding:14px 34px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
  }

  button:hover{
    background:#1d4ed8;
  }
</style>
</head>

<body>

<div class="container">

  <h1>Statistics Graph Animation</h1>

  <button onclick="startAnimation()">Start Animation</button>

  <div class="grid">

    <div class="card">
      <h2>Measurement Scatter Plot</h2>
      <canvas id="scatterChart"></canvas>
    </div>

    <div class="card">
      <h2>Normal Distribution</h2>
      <canvas id="normalChart"></canvas>
    </div>

  </div>

</div>

<script>
const dataValues = [12.10,12.08,12.12,12.11,12.09,12.13,12.07,12.10];

const mean = 12.10;
const sigma = 0.02;

let scatterChart;
let normalChart;

function createScatterChart(count){

  const visiblePoints = dataValues.slice(0,count).map((y,i)=>({
    x:i+1,
    y:y
  }));

  const meanLine = count >= dataValues.length
  ? [{x:1,y:mean},{x:8,y:mean}]
  : [];

  if(scatterChart) scatterChart.destroy();

  scatterChart = new Chart(
    document.getElementById("scatterChart"),
    {
      type:"scatter",

      data:{
        datasets:[
          {
            label:"Measurements",
            data:visiblePoints,
            pointRadius:10,
            pointHoverRadius:12,
            pointBackgroundColor:"#22d3ee",
            pointBorderColor:"#ffffff",
            pointBorderWidth:2
          },

          {
            label:"Mean",
            data:meanLine,
            type:"line",
            borderColor:"#22c55e",
            borderWidth:4,
            borderDash:[10,6],
            pointRadius:0
          }
        ]
      },

      options:{
        responsive:true,
        maintainAspectRatio:false,

        animation:{
          duration:700
        },

        scales:{
          x:{
            min:0,
            max:9,
            ticks:{color:"white"},
            grid:{color:"#1e293b"}
          },

          y:{
            min:12.04,
            max:12.16,
            ticks:{color:"white"},
            grid:{color:"#1e293b"}
          }
        },

        plugins:{
          legend:{
            labels:{color:"white"}
          }
        }
      }
    }
  );
}

function gaussian(x){
  return Math.exp(
    -0.5*Math.pow((x-mean)/sigma,2)
  );
}

function createNormalChart(stage){

  const curve=[];

  for(let x=12.02;x<=12.18;x+=0.001){
    curve.push({
      x:x,
      y:gaussian(x)
    });
  }

  const datasets=[];

  if(stage>=1){

    datasets.push({
      label:"Normal Curve",
      data:curve,
      type:"line",
      borderColor:"#60a5fa",
      borderWidth:4,
      pointRadius:0,
      tension:0.4
    });
  }

  if(stage>=2){

    datasets.push({
      label:"68%",
      data:[
        {x:mean-sigma,y:0},
        {x:mean-sigma,y:1},
        {x:mean+sigma,y:1},
        {x:mean+sigma,y:0}
      ],

      type:"line",
      borderColor:"#22c55e",
      backgroundColor:"rgba(34,197,94,0.25)",
      fill:true,
      pointRadius:0
    });
  }

  if(stage>=3){

    datasets.push({
      label:"95%",
      data:[
        {x:mean-2*sigma,y:0},
        {x:mean-2*sigma,y:0.55},
        {x:mean+2*sigma,y:0.55},
        {x:mean+2*sigma,y:0}
      ],

      type:"line",
      borderColor:"#facc15",
      backgroundColor:"rgba(250,204,21,0.18)",
      fill:true,
      pointRadius:0
    });
  }

  if(stage>=4){

    datasets.push({
      label:"99%",
      data:[
        {x:mean-3*sigma,y:0},
        {x:mean-3*sigma,y:0.3},
        {x:mean+3*sigma,y:0.3},
        {x:mean+3*sigma,y:0}
      ],

      type:"line",
      borderColor:"#ec4899",
      backgroundColor:"rgba(236,72,153,0.15)",
      fill:true,
      pointRadius:0
    });
  }

  if(normalChart) normalChart.destroy();

  normalChart = new Chart(
    document.getElementById("normalChart"),
    {
      type:"line",

      data:{
        datasets:datasets
      },

      options:{
        responsive:true,
        maintainAspectRatio:false,

        animation:{
          duration:1000
        },

        scales:{
          x:{
            type:"linear",
            min:12.02,
            max:12.18,
            ticks:{color:"white"},
            grid:{color:"#1e293b"}
          },

          y:{
            min:0,
            max:1.1,
            ticks:{color:"white"},
            grid:{color:"#1e293b"}
          }
        },

        plugins:{
          legend:{
            labels:{color:"white"}
          }
        }
      }
    }
  );
}

function startAnimation(){

  createScatterChart(0);
  createNormalChart(0);

  let count=0;

  const timer = setInterval(()=>{

    count++;

    createScatterChart(count);

    if(count===dataValues.length){

      clearInterval(timer);

      setTimeout(()=>{
        createNormalChart(1);
      },700);

      setTimeout(()=>{
        createNormalChart(2);
      },1600);

      setTimeout(()=>{
        createNormalChart(3);
      },2600);

      setTimeout(()=>{
        createNormalChart(4);
      },3600);
    }

  },550);
}

createScatterChart(0);
createNormalChart(0);
</script>

</body>
</html>
