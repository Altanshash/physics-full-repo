<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem 3 - Model Comparison</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .panel {
      background: #1f2937;
      padding: 15px;
      border-radius: 12px;
    }

    canvas {
      background: white;
      border-radius: 8px;
      border: 2px solid #374151;
    }

    .controls {
      max-width: 850px;
      margin: 10px auto 30px;
      padding: 20px;
      background: #1f2937;
      border-radius: 12px;
    }

    .control {
      text-align: left;
      margin: 14px 0;
    }

    input[type="range"] {
      width: 100%;
    }

    .value {
      color: #93c5fd;
      font-weight: bold;
    }

    button {
      margin: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <h1>Problem 3 - Comparison of Heliocentric and Epicycle Models</h1>

  <div class="container">
    <div class="panel">
      <h2>Trajectory Comparison</h2>
      <canvas id="orbitCanvas" width="560" height="560"></canvas>
    </div>

    <div class="panel">
      <h2>Error Graph</h2>
      <canvas id="errorCanvas" width="560" height="560"></canvas>
    </div>
  </div>

  <div class="controls">
    <div class="control">
      <label>Mars radius RM: <span id="RMValue" class="value"></span></label>
      <input type="range" id="RM" min="80" max="220" value="170">
    </div>

    <div class="control">
      <label>Earth radius RZ: <span id="RZValue" class="value"></span></label>
      <input type="range" id="RZ" min="40" max="160" value="100">
    </div>

    <div class="control">
      <label>Mars angular velocity ωM: <span id="omegaMValue" class="value"></span></label>
      <input type="range" id="omegaM" min="0.2" max="3" step="0.1" value="1.1">
    </div>

    <div class="control">
      <label>Earth angular velocity ωZ: <span id="omegaZValue" class="value"></span></label>
      <input type="range" id="omegaZ" min="0.2" max="4" step="0.1" value="2.0">
    </div>

    <button onclick="toggleAnimation()">Pause / Play</button>
    <button onclick="resetAnimation()">Reset</button>
    <button onclick="clearTrace()">Clear Trace</button>
  </div>

  <script>
    const orbitCanvas = document.getElementById("orbitCanvas");
    const orbitCtx = orbitCanvas.getContext("2d");

    const errorCanvas = document.getElementById("errorCanvas");
    const errorCtx = errorCanvas.getContext("2d");

    const RM = document.getElementById("RM");
    const RZ = document.getElementById("RZ");
    const omegaM = document.getElementById("omegaM");
    const omegaZ = document.getElementById("omegaZ");

    const RMValue = document.getElementById("RMValue");
    const RZValue = document.getElementById("RZValue");
    const omegaMValue = document.getElementById("omegaMValue");
    const omegaZValue = document.getElementById("omegaZValue");

    let t = 0;
    let running = true;

    let helioTrace = [];
    let epiTrace = [];
    let errorTrace = [];

    function values() {
      return {
        RM: Number(RM.value),
        RZ: Number(RZ.value),
        omegaM: Number(omegaM.value),
        omegaZ: Number(omegaZ.value)
      };
    }

    function updateLabels() {
      const v = values();
      RMValue.textContent = v.RM;
      RZValue.textContent = v.RZ;
      omegaMValue.textContent = v.omegaM;
      omegaZValue.textContent = v.omegaZ;
    }

    function heliocentricRelative(time) {
      const v = values();

      return {
        x: v.RM * Math.cos(v.omegaM * time) - v.RZ * Math.cos(v.omegaZ * time),
        y: v.RM * Math.sin(v.omegaM * time) - v.RZ * Math.sin(v.omegaZ * time)
      };
    }

    function epicycleModel(time) {
      const v = values();

      return {
        x: v.RM * Math.cos(v.omegaM * time) + v.RZ * Math.cos(v.omegaZ * time + Math.PI),
        y: v.RM * Math.sin(v.omegaM * time) + v.RZ * Math.sin(v.omegaZ * time + Math.PI)
      };
    }

    function drawAxes(ctx, w, h, cx, cy) {
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(w, cy);
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, h);
      ctx.stroke();

      ctx.fillStyle = "#111827";
      ctx.font = "13px Arial";
      ctx.fillText("0", cx + 5, cy + 15);
      ctx.fillText("x", w - 20, cy - 8);
      ctx.fillText("y", cx + 8, 20);
    }

    function drawTrajectory() {
      const w = orbitCanvas.width;
      const h = orbitCanvas.height;
      const cx = w / 2;
      const cy = h / 2;

      orbitCtx.clearRect(0, 0, w, h);
      drawAxes(orbitCtx, w, h, cx, cy);

      orbitCtx.fillStyle = "#111827";
      orbitCtx.font = "14px Arial";
      orbitCtx.fillText("Blue = heliocentric relative model", 15, 25);
      orbitCtx.fillText("Red dashed = fitted epicycle model", 15, 45);

      drawPath(orbitCtx, helioTrace, cx, cy, "#2563eb", 3, false);
      drawPath(orbitCtx, epiTrace, cx, cy, "#dc2626", 2, true);

      const hpos = heliocentricRelative(t);
      const epos = epicycleModel(t);

      orbitCtx.fillStyle = "#2563eb";
      orbitCtx.beginPath();
      orbitCtx.arc(cx + hpos.x, cy - hpos.y, 7, 0, Math.PI * 2);
      orbitCtx.fill();

      orbitCtx.fillStyle = "#dc2626";
      orbitCtx.beginPath();
      orbitCtx.arc(cx + epos.x, cy - epos.y, 5, 0, Math.PI * 2);
      orbitCtx.fill();
    }

    function drawPath(ctx, data, cx, cy, color, width, dashed) {
      if (data.length < 2) return;

      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dashed ? [8, 6] : []);

      ctx.beginPath();

      for (let i = 0; i < data.length; i++) {
        const px = cx + data[i].x;
        const py = cy - data[i].y;

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }

      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawErrorGraph() {
      const w = errorCanvas.width;
      const h = errorCanvas.height;
      const margin = 55;

      errorCtx.clearRect(0, 0, w, h);

      errorCtx.strokeStyle = "#e5e7eb";
      errorCtx.lineWidth = 1;

      errorCtx.beginPath();
      errorCtx.moveTo(margin, h - margin);
      errorCtx.lineTo(w - margin, h - margin);
      errorCtx.moveTo(margin, margin);
      errorCtx.lineTo(margin, h - margin);
      errorCtx.stroke();

      errorCtx.fillStyle = "#111827";
      errorCtx.font = "14px Arial";
      errorCtx.fillText("time", w - 90, h - margin + 30);
      errorCtx.fillText("error", margin - 35, margin - 15);
      errorCtx.fillText("0", margin - 22, h - margin + 5);
      errorCtx.fillText("10", margin - 28, h - margin - 100);

      if (errorTrace.length > 1) {
        errorCtx.strokeStyle = "#7c3aed";
        errorCtx.lineWidth = 2;
        errorCtx.beginPath();

        for (let i = 0; i < errorTrace.length; i++) {
          const x = margin + (i / 500) * (w - 2 * margin);
          const y = h - margin - errorTrace[i] * 10;

          if (i === 0) errorCtx.moveTo(x, y);
          else errorCtx.lineTo(x, y);
        }

        errorCtx.stroke();
      }

      const currentError = errorTrace.length > 0 ? errorTrace[errorTrace.length - 1] : 0;

      errorCtx.fillStyle = "#111827";
      errorCtx.font = "15px Arial";
      errorCtx.fillText("Current error: " + currentError.toFixed(6), 20, 30);
      errorCtx.fillText("For exact fitting, error should be 0.", 20, 52);
    }

    function animate() {
      updateLabels();

      if (running) {
        t += 0.015;

        const hpos = heliocentricRelative(t);
        const epos = epicycleModel(t);

        const error = Math.sqrt(
          Math.pow(hpos.x - epos.x, 2) +
          Math.pow(hpos.y - epos.y, 2)
        );

        helioTrace.push(hpos);
        epiTrace.push(epos);
        errorTrace.push(error);

        if (helioTrace.length > 1800) helioTrace.shift();
        if (epiTrace.length > 1800) epiTrace.shift();
        if (errorTrace.length > 500) errorTrace.shift();
      }

      drawTrajectory();
      drawErrorGraph();

      requestAnimationFrame(animate);
    }

    function toggleAnimation() {
      running = !running;
    }

    function resetAnimation() {
      t = 0;
      clearTrace();
    }

    function clearTrace() {
      helioTrace = [];
      epiTrace = [];
      errorTrace = [];
    }

    RM.addEventListener("input", clearTrace);
    RZ.addEventListener("input", clearTrace);
    omegaM.addEventListener("input", clearTrace);
    omegaZ.addEventListener("input", clearTrace);

    animate();
  </script>
</body>
</html>
