<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lorentz Transformation Animation</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
    overflow-x:hidden;
}

h1{
    text-align:center;
    margin-top:20px;
    color:#7dd3fc;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
    background:#111827;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(125,211,252,0.3);
}

.space{
    position:relative;
    height:300px;
    background:linear-gradient(to right,#020617,#1e293b);
    border-radius:15px;
    overflow:hidden;
    border:2px solid #334155;
}

.axis{
    position:absolute;
    width:100%;
    height:2px;
    background:white;
    top:150px;
}

.label{
    position:absolute;
    color:#facc15;
    font-size:18px;
    font-weight:bold;
}

.event{
    position:absolute;
    width:24px;
    height:24px;
    border-radius:50%;
    animation:pulse 1.2s infinite;
}

.event1{
    background:#22c55e;
    left:120px;
    top:138px;
}

.event2{
    background:#ef4444;
    left:700px;
    top:138px;
}

@keyframes pulse{
    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:0.6;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.frame{
    position:absolute;
    top:50px;
    left:0;
    width:180px;
    height:60px;
    background:#38bdf8;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    color:#0f172a;
    animation:moveFrame 8s linear infinite;
}

@keyframes moveFrame{
    0%{
        left:-200px;
    }

    100%{
        left:110%;
    }
}

.info{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    gap:20px;
    margin-top:35px;
}

.card{
    width:280px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    border:1px solid #475569;
}

.card h2{
    color:#facc15;
    margin-bottom:15px;
    text-align:center;
}

.value{
    text-align:center;
    font-size:30px;
    color:#38bdf8;
    font-weight:bold;
}

.formula{
    margin-top:30px;
    background:#020617;
    padding:20px;
    border-radius:12px;
    line-height:2;
    font-size:22px;
    text-align:center;
}

.result{
    margin-top:25px;
    color:#86efac;
    font-size:22px;
    text-align:center;
    font-weight:bold;
}

button{
    margin-top:25px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>
</head>

<body>

<h1>Lorentz Transformation</h1>

<div class="container">

    <div class="space">

        <div class="axis"></div>

        <div class="label" style="left:100px; top:170px;">
            Event 1
        </div>

        <div class="label" style="left:680px; top:170px;">
            Event 2
        </div>

        <div class="event event1"></div>

        <div class="event event2"></div>

        <div class="frame">
            Moving Frame S′
        </div>

    </div>

    <div class="info">

        <div class="card">
            <h2>Velocity</h2>
            <div class="value">0.6c</div>
        </div>

        <div class="card">
            <h2>Lorentz Factor</h2>
            <div class="value">γ = 1.25</div>
        </div>

        <div class="card">
            <h2>Transformed Position</h2>
            <div class="value">225 m</div>
        </div>

        <div class="card">
            <h2>Transformed Time</h2>
            <div class="value">2.75 μs</div>
        </div>

    </div>

    <div class="formula">

        x′ = γ(x − vt)

        <br><br>

        t′ = γ(t − vx/c²)

        <br><br>

        s² = c²t² − x²

    </div>

    <div class="result">

        The spacetime interval remains invariant
        under Lorentz transformation.

    </div>

    <center>
        <button onclick="restartAnimation()">
            Restart Animation
        </button>
    </center>

</div>

<script>

function restartAnimation(){

    const frame = document.querySelector(".frame");

    frame.style.animation = "none";

    frame.offsetHeight;

    frame.style.animation = "moveFrame 8s linear infinite";
}

</script>

</body>
</html>
