<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copernicus Model Animation</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .panel {
      background: #1f2937;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }

    canvas {
      background: white;
      border-radius: 10px;
      border: 2px solid #374151;
    }

    .controls {
      max-width: 850px;
      margin: 10px auto 30px;
      background: #1f2937;
      padding: 20px;
      border-radius: 12px;
    }

    .control {
      margin: 14px 0;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
    }

    button {
      margin: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .value {
      color: #93c5fd;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Copernicus Model: Earth and Mars Motion</h1>

  <div class="container">
    <div class="panel">
      <h2>Heliocentric View</h2>
      <canvas id="helioCanvas" width="520" height="520"></canvas>
    </div>

    <div class="panel">
      <h2>Geocentric View</h2>
      <canvas id="geoCanvas" width="520" height="520"></canvas>
    </div>
  </div>

  <div class="controls">
    <div class="control">
      <label>Earth orbit radius RZ: <span id="RZValue" class="value"></span></label>
      <input type="range" id="RZ" min="40" max="160" value="100" />
    </div>

    <div class="control">
      <label>Mars orbit radius RM: <span id="RMValue" class="value"></span></label>
      <input type="range" id="RM" min="80" max="230" value="170" />
    </div>

    <div class="control">
      <label>Earth angular velocity ωZ: <span id="omegaZValue" class="value"></span></label>
      <input type="range" id="omegaZ" min="0.2" max="4" step="0.1" value="2" />
    </div>

    <div class="control">
      <label>Mars angular velocity ωM: <span id="omegaMValue" class="value"></span></label>
      <input type="range" id="omegaM" min="0.1" max="3" step="0.1" value="1.1" />
    </div>

    <button onclick="toggleAnimation()">Pause / Play</button>
    <button onclick="resetAnimation()">Reset</button>
    <button onclick="clearTrace()">Clear Trace</button>
  </div>

  <script>
    const helioCanvas = document.getElementById("helioCanvas");
    const helioCtx = helioCanvas.getContext("2d");

    const geoCanvas = document.getElementById("geoCanvas");
    const geoCtx = geoCanvas.getContext("2d");

    const RZSlider = document.getElementById("RZ");
    const RMSlider = document.getElementById("RM");
    const omegaZSlider = document.getElementById("omegaZ");
    const omegaMSlider = document.getElementById("omegaM");

    const RZValue = document.getElementById("RZValue");
    const RMValue = document.getElementById("RMValue");
    const omegaZValue = document.getElementById("omegaZValue");
    const omegaMValue = document.getElementById("omegaMValue");

    let t = 0;
    let running = true;

    let earthTrace = [];
    let marsTrace = [];
    let relativeTrace = [];

    function getValues() {
      return {
        RZ: Number(RZSlider.value),
        RM: Number(RMSlider.value),
        omegaZ: Number(omegaZSlider.value),
        omegaM: Number(omegaMSlider.value)
      };
    }

    function updateLabels() {
      const values = getValues();

      RZValue.textContent = values.RZ;
      RMValue.textContent = values.RM;
      omegaZValue.textContent = values.omegaZ;
      omegaMValue.textContent = values.omegaM;
    }

    function positions(time) {
      const { RZ, RM, omegaZ, omegaM } = getValues();

      const earth = {
        x: RZ * Math.cos(omegaZ * time),
        y: RZ * Math.sin(omegaZ * time)
      };

      const mars = {
        x: RM * Math.cos(omegaM * time),
        y: RM * Math.sin(omegaM * time)
      };

      const relativeMars = {
        x: mars.x - earth.x,
        y: mars.y - earth.y
      };

      return { earth, mars, relativeMars };
    }

    function drawAxes(ctx, width, height, cx, cy) {
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, height);
      ctx.moveTo(0, cy);
      ctx.lineTo(width, cy);
      ctx.stroke();
    }

    function drawHeliocentric() {
      const width = helioCanvas.width;
      const height = helioCanvas.height;
      const cx = width / 2;
      const cy = height / 2;

      const { RZ, RM } = getValues();
      const { earth, mars } = positions(t);

      helioCtx.clearRect(0, 0, width, height);

      drawAxes(helioCtx, width, height, cx, cy);

      helioCtx.strokeStyle = "#9ca3af";
      helioCtx.lineWidth = 1.5;

      helioCtx.beginPath();
      helioCtx.arc(cx, cy, RZ, 0, Math.PI * 2);
      helioCtx.stroke();

      helioCtx.beginPath();
      helioCtx.arc(cx, cy, RM, 0, Math.PI * 2);
      helioCtx.stroke();

      if (earthTrace.length > 1) {
        helioCtx.strokeStyle = "#2563eb";
        helioCtx.lineWidth = 2;
        helioCtx.beginPath();

        for (let i = 0; i < earthTrace.length; i++) {
          const p = earthTrace[i];
          const px = cx + p.x;
          const py = cy - p.y;

          if (i === 0) helioCtx.moveTo(px, py);
          else helioCtx.lineTo(px, py);
        }

        helioCtx.stroke();
      }

      if (marsTrace.length > 1) {
        helioCtx.strokeStyle = "#dc2626";
        helioCtx.lineWidth = 2;
        helioCtx.beginPath();

        for (let i = 0; i < marsTrace.length; i++) {
          const p = marsTrace[i];
          const px = cx + p.x;
          const py = cy - p.y;

          if (i === 0) helioCtx.moveTo(px, py);
          else helioCtx.lineTo(px, py);
        }

        helioCtx.stroke();
      }

      helioCtx.fillStyle = "#f59e0b";
      helioCtx.beginPath();
      helioCtx.arc(cx, cy, 10, 0, Math.PI * 2);
      helioCtx.fill();

      helioCtx.fillStyle = "#111827";
      helioCtx.font = "14px Arial";
      helioCtx.fillText("Sun", cx + 12, cy - 12);

      helioCtx.fillStyle = "#2563eb";
      helioCtx.beginPath();
      helioCtx.arc(cx + earth.x, cy - earth.y, 7, 0, Math.PI * 2);
      helioCtx.fill();
      helioCtx.fillText("Earth", cx + earth.x + 10, cy - earth.y);

      helioCtx.fillStyle = "#dc2626";
      helioCtx.beginPath();
      helioCtx.arc(cx + mars.x, cy - mars.y, 8, 0, Math.PI * 2);
      helioCtx.fill();
      helioCtx.fillText("Mars", cx + mars.x + 10, cy - mars.y);
    }

    function drawGeocentric() {
      const width = geoCanvas.width;
      const height = geoCanvas.height;
      const cx = width / 2;
      const cy = height / 2;

      const { relativeMars } = positions(t);

      geoCtx.clearRect(0, 0, width, height);

      drawAxes(geoCtx, width, height, cx, cy);

      if (relativeTrace.length > 1) {
        geoCtx.strokeStyle = "#7c3aed";
        geoCtx.lineWidth = 2;
        geoCtx.beginPath();

        for (let i = 0; i < relativeTrace.length; i++) {
          const p = relativeTrace[i];
          const px = cx + p.x;
          const py = cy - p.y;

          if (i === 0) geoCtx.moveTo(px, py);
          else geoCtx.lineTo(px, py);
        }

        geoCtx.stroke();
      }

      geoCtx.strokeStyle = "#111827";
      geoCtx.lineWidth = 2;
      geoCtx.beginPath();
      geoCtx.moveTo(cx, cy);
      geoCtx.lineTo(cx + relativeMars.x, cy - relativeMars.y);
      geoCtx.stroke();

      geoCtx.fillStyle = "#2563eb";
      geoCtx.beginPath();
      geoCtx.arc(cx, cy, 8, 0, Math.PI * 2);
      geoCtx.fill();

      geoCtx.fillStyle = "#111827";
      geoCtx.font = "14px Arial";
      geoCtx.fillText("Earth", cx + 12, cy - 12);

      geoCtx.fillStyle = "#dc2626";
      geoCtx.beginPath();
      geoCtx.arc(cx + relativeMars.x, cy - relativeMars.y, 8, 0, Math.PI * 2);
      geoCtx.fill();

      geoCtx.fillStyle = "#111827";
      geoCtx.fillText("Mars", cx + relativeMars.x + 10, cy - relativeMars.y);
    }

    function animate() {
      updateLabels();

      if (running) {
        t += 0.015;

        const { earth, mars, relativeMars } = positions(t);

        earthTrace.push(earth);
        marsTrace.push(mars);
        relativeTrace.push(relativeMars);

        if (earthTrace.length > 1200) earthTrace.shift();
        if (marsTrace.length > 1200) marsTrace.shift();
        if (relativeTrace.length > 2000) relativeTrace.shift();
      }

      drawHeliocentric();
      drawGeocentric();

      requestAnimationFrame(animate);
    }

    function toggleAnimation() {
      running = !running;
    }

    function resetAnimation() {
      t = 0;
      clearTrace();
    }

    function clearTrace() {
      earthTrace = [];
      marsTrace = [];
      relativeTrace = [];
    }

    RZSlider.addEventListener("input", clearTrace);
    RMSlider.addEventListener("input", clearTrace);
    omegaZSlider.addEventListener("input", clearTrace);
    omegaMSlider.addEventListener("input", clearTrace);

    animate();
  </script>
</body>
</html>
